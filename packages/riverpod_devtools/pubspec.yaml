name: riverpod_devtools
description: DevTools extension for Riverpod - inspect providers in real-time, now with MCP support for AI coding tools.
version: 1.0.0
repository: https://github.com/yutsuki3/riverpod_devtools
homepage: https://github.com/yutsuki3/riverpod_devtools
issue_tracker: https://github.com/yutsuki3/riverpod_devtools/issues

topics:
  - riverpod
  - devtools
  - state-management
  - debugging
  - mcp

screenshots:
  - description: 'State Inspector: provider list with family grouping, provider details with Invalidate/Refresh, and the live event log'
    path: example/screenshot_inspector.png
  - description: 'Interactive provider dependency graph with watch/read/listen edges, runtime status colors, and a legend'
    path: example/screenshot_graph.png
  - description: 'Performance Stats: per-provider update rate, async load time, and churn, flagging hot or slow providers'
    path: example/screenshot_stats.png

environment:
  sdk: ^3.7.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ">=2.3.0 <4.0.0"
  analyzer: ">=6.0.0 <15.0.0"
  path: ^1.9.0
  dart_mcp: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

executables:
  analyze:
  riverpod_devtools_mcp:

extension:
  devtools:
    asset: extension/devtools/build
    config: extension/devtools/config.yaml

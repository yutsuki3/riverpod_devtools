name: riverpod_devtools_example
description: "Example app demonstrating riverpod_devtools with static dependency analysis."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: '>=2.3.0 <4.0.0'
  riverpod_devtools:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/riverpod_dependencies.json


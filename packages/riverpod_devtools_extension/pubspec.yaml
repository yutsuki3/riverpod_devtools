name: riverpod_devtools_extension
description: DevTools extension UI for riverpod_devtools
publish_to: 'none'

version: 1.1.1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  devtools_extensions: ^0.3.0
  devtools_app_shared: ^0.3.0
  diff_match_patch: ^0.4.1
  # >=15.0.0 is required to resolve with Flutter >=3.32 (flutter_test pins
  # vm_service 15.0.0); keep 14.x allowed for older Flutter SDKs.
  vm_service: '>=14.0.0 <16.0.0'
  url_launcher: ^6.3.1
  # Session import/export uses the browser download/upload APIs directly
  # (the extension only ever runs on web, inside DevTools).
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Bundle a monospace font so JSON value trees / state render reliably even
  # when the DevTools session can't reach the font CDN (offline or restricted
  # networks). CanvasKit otherwise leaves `fontFamily: 'monospace'` text blank.
  fonts:
    - family: monospace
      fonts:
        - asset: fonts/RobotoMono-Regular.ttf
        - asset: fonts/RobotoMono-Bold.ttf
          weight: 700



